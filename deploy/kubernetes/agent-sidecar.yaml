# Add this container and volume to a workload pod. The enrollment code should
# be a short-lived Secret value and removed after the first successful start.
apiVersion: v1
kind: Secret
metadata:
  name: shenmux-agent-bootstrap
  namespace: default
type: Opaque
stringData:
  enrollment-code: replace-me
---
# Fragment intended to be merged into the workload's pod spec.
apiVersion: v1
kind: ConfigMap
metadata:
  name: shenmux-agent-sidecar-example
  namespace: default
data:
  pod-spec.yaml: |
    containers:
      - name: shenmux-agent
        image: ghcr.io/pyrex41/shenmux:latest
        args:
          - agent
          - --controller
          - https://shenmux.example.com
          - --transport
          - relay
          - --namespace
          - $(POD_NAMESPACE)
          - --pod
          - $(POD_NAME)
          - --workload
          - $(SHENMUX_WORKLOAD)
          - --harness
          - $(SHENMUX_HARNESS)
          - --session
          - $(SHENMUX_SESSION)
          - --control
          - ipc:///run/shenmux/$(SHENMUX_SESSION).ctl
          - --data
          - ipc:///run/shenmux/$(SHENMUX_SESSION).pub
          - --enrollment-code
          - $(SHENMUX_ENROLLMENT_CODE)
        env:
          - name: POD_NAME
            valueFrom: {fieldRef: {fieldPath: metadata.name}}
          - name: POD_NAMESPACE
            valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
          - name: NODE_NAME
            valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
          - name: SHENMUX_ENROLLMENT_CODE
            valueFrom:
              secretKeyRef: {name: shenmux-agent-bootstrap, key: enrollment-code}
          - name: SHENMUX_WORKLOAD
            value: replace-with-workload
          - name: SHENMUX_HARNESS
            value: codex
          - name: SHENMUX_SESSION
            value: codex
        volumeMounts:
          - name: shenmux-state
            mountPath: /var/lib/shenmux
          - name: shenmux-ipc
            mountPath: /run/shenmux
    volumes:
      - name: shenmux-state
        emptyDir: {}
      - name: shenmux-ipc
        emptyDir: {}
