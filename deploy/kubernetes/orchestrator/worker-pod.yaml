# Phase-0 sketch of the pod the operator would create per AgentWorker: the
# harness runs inside a shenmux PTY session, and the agent sidecar relays it
# outbound to the controller. See docs/K8S-ORCHESTRATION.md. Assumes a worker
# image containing both the full shenmux binary and the harness binary; the
# root Dockerfile does not build one yet.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: worker-fix-flaky-tests
  namespace: agents
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
  # Fork variant: provision from a snapshot of the source worker's PVC.
  # dataSourceRef:
  #   apiGroup: snapshot.storage.k8s.io
  #   kind: VolumeSnapshot
  #   name: fix-flaky-tests-snap-2026-08-06
---
apiVersion: v1
kind: Pod
metadata:
  name: worker-fix-flaky-tests
  namespace: agents
  labels:
    shenmux.dev/worker: fix-flaky-tests
    shenmux.dev/harness: codex
spec:
  # runtimeClassName: gvisor   # recommended: pods run untrusted agent output
  securityContext:
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
  initContainers:
    - name: ipc-permissions
      image: ghcr.io/pyrex41/shenmux-worker-codex:latest
      command: ["sh", "-c", "chown 999:999 /run/shenmux && chmod 700 /run/shenmux"]
      securityContext:
        runAsUser: 0
      volumeMounts:
        - name: shenmux-ipc
          mountPath: /run/shenmux
    # Transparent-proxy enforcement: redirect the harness UID's egress to the
    # secret-proxy and drop its direct egress, so the proxy is the only way
    # out even if the harness ignores HTTPS_PROXY. Runs once, needs NET_ADMIN.
    - name: egress-redirect
      image: ghcr.io/pyrex41/shenmux-secret-proxy:latest
      command:
        - sh
        - -c
        - |
          iptables -t nat -A OUTPUT -p tcp -m owner --uid-owner 999 \
            ! -d 127.0.0.1 -j REDIRECT --to-ports 8888
          iptables -A OUTPUT -p tcp -m owner --uid-owner 999 \
            ! -o lo -m tcp --dport 443 -j DROP
      securityContext:
        runAsUser: 0
        capabilities:
          add: [NET_ADMIN]
  containers:
    - name: harness
      image: ghcr.io/pyrex41/shenmux-worker-codex:latest
      command:
        - shenmux
        - run
        - --session
        - fix-flaky-tests
        - --history-dir
        - /state/shenmux/history
        - --control
        - ipc:///run/shenmux/fix-flaky-tests.ctl
        - --data
        - ipc:///run/shenmux/fix-flaky-tests.pub
        - --
        - codex
        - exec
        - "Find and fix the flaky tests in ./services/api"
        # resume variant after suspend: codex resume --last
      workingDir: /state/workspace
      env:
        - name: HOME
          value: /state/home
        # The harness holds ONLY a placeholder; the real key is swapped in by
        # the secret-proxy sidecar for allow-listed hosts. See
        # docs/K8S-ORCHESTRATION.md "Credential interception".
        - name: ANTHROPIC_API_KEY
          value: sk-placeholder-anthropic
        - name: HTTPS_PROXY
          value: http://localhost:8888
        - name: HTTP_PROXY
          value: http://localhost:8888
        - name: NODE_EXTRA_CA_CERTS
          value: /state/proxy-ca/ca.crt
        - name: REQUESTS_CA_BUNDLE
          value: /state/proxy-ca/ca.crt
        - name: SSL_CERT_FILE
          value: /state/proxy-ca/ca.crt
      volumeMounts:
        - name: state
          mountPath: /state
        - name: shenmux-ipc
          mountPath: /run/shenmux
        - name: proxy-ca
          mountPath: /state/proxy-ca
          readOnly: true
    # Sole egress for the harness: swaps the placeholder for the real secret
    # (fetched from OpenBao, held in memory only) in auth headers, and only
    # for hosts in that secret's allowed_hosts. NetworkPolicy below makes this
    # the only route out, so ignoring HTTPS_PROXY fails closed.
    - name: secret-proxy
      image: ghcr.io/pyrex41/shenmux-secret-proxy:latest
      args: ["--listen", "127.0.0.1:8888", "--secrets", "/etc/sq/secrets.json", "--ca-dir", "/state/proxy-ca"]
      env:
        # OpenBao Kubernetes auth: the sidecar exchanges the pod's
        # ServiceAccount token for a short-lived token, reads the real value,
        # keeps it in memory. secrets.json carries placeholder + allowed_hosts
        # + bao path only — never a value.
        - name: BAO_ADDR
          value: https://openbao.openbao.svc:8200
        - name: BAO_K8S_ROLE
          value: harness-codex
      volumeMounts:
        - name: proxy-ca
          mountPath: /state/proxy-ca
        - name: secrets-config
          mountPath: /etc/sq
          readOnly: true
    - name: shenmux-agent
      image: ghcr.io/pyrex41/shenmux-worker-codex:latest
      command:
        - shenmux
        - agent
        - --controller
        - https://mux.example.com
        - --transport
        - relay
        - --harness
        - codex
        - --workload
        - fix-flaky-tests
        - --namespace
        - $(POD_NAMESPACE)
        - --pod
        - $(POD_NAME)
        - --node
        - $(NODE_NAME)
        - --session
        - fix-flaky-tests
        - --control
        - ipc:///run/shenmux/fix-flaky-tests.ctl
        - --data
        - ipc:///run/shenmux/fix-flaky-tests.pub
        - --enrollment-code
        - $(SHENMUX_ENROLLMENT_CODE)
      env:
        - name: POD_NAME
          valueFrom: {fieldRef: {fieldPath: metadata.name}}
        - name: POD_NAMESPACE
          valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
        - name: NODE_NAME
          valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
        # Single-use code the operator mints from the controller per worker;
        # the enrollment-mint API is net-new shenmux work (see design doc).
        - name: SHENMUX_ENROLLMENT_CODE
          valueFrom:
            secretKeyRef: {name: worker-fix-flaky-tests-enroll, key: code}
      volumeMounts:
        - name: state
          mountPath: /state
        - name: shenmux-ipc
          mountPath: /run/shenmux
  volumes:
    - name: state
      persistentVolumeClaim:
        claimName: worker-fix-flaky-tests
    - name: shenmux-ipc
      emptyDir: {}
    # CA the proxy generates and the harness trusts; shared in-pod.
    - name: proxy-ca
      emptyDir: {}
    # Placeholder + allowed_hosts + OpenBao path per secret — never a value.
    - name: secrets-config
      secret:
        secretName: worker-fix-flaky-tests-secrets-config
---
# Pod-level default-deny egress: DNS, plus :443 for the SECRET-PROXY's
# upstream calls. NOTE: all containers in a pod share one network namespace,
# so NetworkPolicy cannot by itself stop the harness from dialing :443
# directly and bypassing the proxy. Sole-egress is enforced in-pod by the
# init container below (iptables owner-match redirect, the transparent-proxy
# pattern): the harness UID's egress is redirected to 127.0.0.1:8888 and
# direct egress from that UID is dropped, so ignoring HTTPS_PROXY fails
# closed. This NetworkPolicy is the outer belt-and-suspenders.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: worker-fix-flaky-tests
  namespace: agents
spec:
  podSelector:
    matchLabels:
      shenmux.dev/worker: fix-flaky-tests
  policyTypes: [Egress]
  egress:
    - to: []
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to: []
      ports:
        - {protocol: TCP, port: 443}
