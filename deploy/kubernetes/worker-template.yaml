# Template for one shenmux worker. Not applied directly — scripts/k8s-worker.sh
# substitutes __NAME__, __IMAGE__ and __TOKEN__ and pipes it to kubectl.
#
# A worker is three containers sharing one IPC directory: the PTY, the browser
# gateway that serves it, and the agent that dials the controller outbound.
# Nothing in the pod listens on a port except the gateway.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shenmux-worker-__NAME__
  namespace: shenmux
  labels:
    shenmux/worker: __NAME__
spec:
  replicas: 1
  selector:
    matchLabels: { app: shenmux-worker-__NAME__ }
  template:
    metadata:
      labels:
        app: shenmux-worker-__NAME__
        shenmux/worker: __NAME__
    spec:
      initContainers:
        # The session daemon refuses to bind unless the IPC directory is owned
        # by the effective uid with no group or other access.
        - name: tighten-ipc
          image: __IMAGE__
          imagePullPolicy: Never
          command: ["/bin/sh", "-c", "chmod 0700 /ipc"]
          volumeMounts:
            - { name: ipc, mountPath: /ipc }
      containers:
        - name: session
          image: __IMAGE__
          imagePullPolicy: Never
          command: ["/usr/local/bin/shenmux"]
          args:
            - run
            - --session=__NAME__
            - --control=ipc:///ipc/__NAME__.ctl
            - --data=ipc:///ipc/__NAME__.pub
          volumeMounts:
            - { name: ipc, mountPath: /ipc }
        - name: web
          image: __IMAGE__
          imagePullPolicy: Never
          command: ["/usr/local/bin/shenmux"]
          args:
            - web
            - --session=__NAME__
            - --listen=0.0.0.0:8787
            - --control=ipc:///ipc/__NAME__.ctl
            - --data=ipc:///ipc/__NAME__.pub
            - --token=__TOKEN__
          ports:
            - { name: web, containerPort: 8787 }
          volumeMounts:
            - { name: ipc, mountPath: /ipc }
        - name: agent
          image: __IMAGE__
          imagePullPolicy: Never
          command: ["/usr/local/bin/shenmux"]
          args:
            - agent
            # Must equal the controller's --origin: it is signed into the
            # enrollment challenge, not a CORS setting.
            - --controller=http://shenmux-controller.shenmux.svc.cluster.local:8788
            - --transport=relay
            - --session=__NAME__
            - --control=ipc:///ipc/__NAME__.ctl
            - --data=ipc:///ipc/__NAME__.pub
            - --state-dir=/state
            - --harness=k8s-trial
          env:
            - name: SHENMUX_ENROLLMENT_CODE
              valueFrom:
                secretKeyRef:
                  name: shenmux-enroll-__NAME__
                  key: code
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef: { fieldPath: metadata.namespace }
            - name: SHENMUX_WORKLOAD
              value: shenmux-worker-__NAME__
          volumeMounts:
            - { name: ipc, mountPath: /ipc }
            - { name: state, mountPath: /state }
      volumes:
        - name: ipc
          emptyDir: {}
        - name: state
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: shenmux-web-__NAME__
  namespace: shenmux
  labels:
    shenmux/worker: __NAME__
spec:
  selector: { app: shenmux-worker-__NAME__ }
  ports:
    - name: web
      port: 8787
      targetPort: web
