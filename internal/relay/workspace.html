<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>shenmux workspace</title><style>
body{margin:0;background:#080b10;color:#d7e0ea;font:14px ui-monospace,monospace}main{display:grid;grid-template-columns:280px 1fr;height:100vh}aside{border-right:1px solid #26313d;padding:16px;overflow:auto}h1{font-size:18px;margin:0 0 14px}.session{display:block;width:100%;text-align:left;background:#111923;border:1px solid #26313d;color:#d7e0ea;padding:9px;margin:6px 0;border-radius:5px;cursor:pointer}.session.active{border-color:#65e6a7}.meta{color:#748294;font-size:11px}.bar{padding:12px;border-bottom:1px solid #26313d}.status{color:#65e6a7}.term{padding:18px;outline:none;white-space:pre;overflow:auto;line-height:1.25;height:calc(100vh - 64px);box-sizing:border-box}.hint{color:#748294;font-size:11px;margin-top:18px}
</style></head><body><main><aside><h1>shenmux workspace</h1><div id="sessions">loading…</div><div class="hint">Select an agent or orchestrator. Click the terminal and type.</div></aside><section><div class="bar"><span id="label">no session</span> · <span id="status">offline</span></div><pre id="term" class="term" tabindex="0"></pre></section></main><script src="/workspace.js" defer></script></body></html>
