<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <!-- interactive-widget: an on-screen keyboard shrinks the page instead of
         sliding it up, so the terminal stays whole above it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
    <title>shenmux</title>
    <!-- Stamped per request by internal/webgateway. A tab left open from a
         previous gateway process keeps the old values and is refused. -->
    <meta name="shenmux-instance" content="__SHENMUX_INSTANCE__">
    <meta name="shenmux-token" content="__SHENMUX_TOKEN__">
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div class="brand"><span class="dot"></span><span>shenmux</span><span class="muted" id="session">connecting</span></div>
        <div class="actions">
          <span class="status" id="status">offline</span>
          <button id="acquire">take control</button>
          <button id="release" class="secondary">release</button>
        </div>
      </header>
      <section class="terminal-wrap" id="screen-wrap">
        <div id="pixi-host"></div>
        <div class="empty" id="empty" hidden></div>
      </section>
      <!-- Shown only where the pointer is coarse. A canvas cannot raise an
           on-screen keyboard, and a phone keyboard does not deliver keys: it
           delivers words, and dictation revises words it has already
           delivered. So a touch device composes here, reviews what the
           recognizer settled on, and sends a line at a time. Physical
           keyboards keep streaming through the canvas. -->
      <form class="compose" id="compose" hidden>
        <textarea id="soft-keys" class="compose-text" rows="1" enterkeyhint="send"
                  aria-label="compose a line for the terminal" autocapitalize="none"
                  autocomplete="off" placeholder="type or dictate, then send"></textarea>
        <button type="submit" id="send">send ⏎</button>
      </form>
      <footer class="bottombar">
        <span id="details">screen —</span>
        <span class="hint">click terminal, type normally · ⌘K clears browser focus</span>
      </footer>
    </main>
    <script src="/app.bundle.js" defer></script>
  </body>
</html>
