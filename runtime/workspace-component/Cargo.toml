[package]
name = "shenmux-workspace-component"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wit-bindgen = "0.45"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
